<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .icon {
      width: 24px;
      height: 24px;
      background: #3b82f6;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status.connected {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    
    .status.disconnected {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    
    .button {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .button:hover {
      background: #f9fafb;
    }
    
    .button.primary {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    
    .button.primary:hover {
      background: #2563eb;
    }
    
    .button.danger {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
    }
    
    .button.danger:hover {
      background: #dc2626;
    }
    
    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    
    .label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }
    
    .captured-count {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">A</div>
    <div>
      <div style="font-weight: 600;">Desktop Automation</div>
      <div style="font-size: 12px; color: #6b7280;">Companion Extension</div>
    </div>
  </div>

  <div id="status" class="status disconnected">
    <span>●</span>
    <span id="statusText">Not Connected</span>
  </div>

  <div id="authSection">
    <label class="label" for="accessToken">Access Token:</label>
    <input type="password" id="accessToken" class="input" placeholder="Paste your access token here">
    <button id="connectBtn" class="button primary">Connect to App</button>
  </div>

  <div id="controlsSection" style="display: none;">
    <button id="pickerBtn" class="button">
      <span>🎯</span>
      <span id="pickerText">Start Element Picker</span>
    </button>
    
    <button id="openAppBtn" class="button">
      <span>🚀</span>
      <span>Open Desktop Automation App</span>
    </button>
    
    <button id="disconnectBtn" class="button" style="border-color: #ef4444; color: #ef4444;">
      <span>🔌</span>
      <span>Disconnect</span>
    </button>
  </div>

  <div id="capturedCount" class="captured-count" style="display: none;">
    <span id="captureCountText">0 elements captured this session</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
